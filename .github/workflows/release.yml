name: Build and publish release

# Tags and main are pushed to Gitea and GitHub from the workstation — there is
# no Gitea→GitHub mirror. This workflow only runs on GitHub. After the zips are
# published it commits manifest.json (and the new versions.json entries) to
# GitHub main so Jellyfin's catalogue URL picks them up. Pull that commit onto
# Gitea afterwards so the two remotes stay in sync.
#
# Jellyfin reads the committed manifest from raw.githubusercontent.com:
#   https://raw.githubusercontent.com/<owner>/<repo>/main/manifest.json
# GitHub Release asset URLs are application/octet-stream after a redirect,
# which the catalogue will not parse.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v12.0.0.1)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          [ -z "$TAG" ] && TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing $TAG"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          # Must match the runtime Jellyfin 12 targets; the plugins are compiled
          # against assemblies copied from the server itself.
          dotnet-version: '10.0.x'

      - name: Build and package
        run: |
          # Assets are attached to this tag's release, so that is the base URL
          # the generated manifest must point at.
          BASE="https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}"
          chmod +x build.sh
          ./build.sh "$BASE"

      - name: Show what was built
        run: |
          echo "--- releases/"
          ls -l releases/
          echo "--- manifest.json"
          cat manifest.json

      - name: Verify manifest checksums match the built zips
        run: |
          python3 - <<'PY'
          import hashlib, json, sys, pathlib
          bad = 0
          for p in json.load(open("manifest.json")):
              v = p["versions"][0]
              name = v["sourceUrl"].rsplit("/", 1)[-1]
              path = pathlib.Path("releases") / name
              if not path.exists():
                  print(f"MISSING {path}"); bad += 1; continue
              got = hashlib.md5(path.read_bytes()).hexdigest()
              if got != v["checksum"]:
                  print(f"CHECKSUM MISMATCH {name}: manifest={v['checksum']} actual={got}")
                  bad += 1
              else:
                  print(f"ok {name} {got}")
          sys.exit(1 if bad else 0)
          PY

      # The manifest offers every past release, not just this one, and a wrong
      # checksum there is just as install-breaking. They come from versions.json
      # and are never recomputed, so this is the only thing checking them.
      - name: Verify the release history still downloads
        run: |
          python3 - <<'PY'
          import hashlib, json, sys, urllib.request
          bad = 0
          for p in json.load(open("manifest.json")):
              for v in p["versions"][1:]:
                  url = v["sourceUrl"]
                  try:
                      with urllib.request.urlopen(url, timeout=60) as r:
                          data = r.read()
                  except Exception as e:
                      print(f"FAILED {url}: {e}"); bad += 1; continue
                  got = hashlib.md5(data).hexdigest()
                  if got != v["checksum"]:
                      print(f"MISMATCH {url}: versions.json={v['checksum']} downloaded={got}")
                      bad += 1
                  else:
                      print(f"ok {p['name']} {v['version']} {got}")
          sys.exit(1 if bad else 0)
          PY

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            releases/*.zip
            assets/*.png
            manifest.json

      # The local checksum check above cannot catch a wrong sourceUrl, so
      # re-verify against what is actually published and downloadable.
      - name: Verify published assets resolve
        run: |
          sleep 10
          python3 - <<'PY'
          import hashlib, json, sys, urllib.request
          bad = 0
          for p in json.load(open("manifest.json")):
              v = p["versions"][0]
              url = v["sourceUrl"]
              try:
                  with urllib.request.urlopen(url, timeout=60) as r:
                      data = r.read()
              except Exception as e:
                  print(f"FAILED {url}: {e}"); bad += 1; continue
              got = hashlib.md5(data).hexdigest()
              if got != v["checksum"]:
                  print(f"MISMATCH {url}: manifest={v['checksum']} downloaded={got}")
                  bad += 1
              else:
                  print(f"ok {url} ({len(data)} bytes)")

              # A broken imageUrl is silent in the catalogue -- the tile just
              # renders empty -- so check it here rather than find out later.
              img = p.get("imageUrl")
              if not img:
                  print(f"NO imageUrl for {p['name']}"); bad += 1; continue
              try:
                  with urllib.request.urlopen(img, timeout=60) as r:
                      blob = r.read()
                  if not blob.startswith(b"\x89PNG"):
                      print(f"NOT A PNG {img}"); bad += 1
                  else:
                      print(f"ok {img} ({len(blob)} bytes)")
              except Exception as e:
                  print(f"FAILED {img}: {e}"); bad += 1
          sys.exit(1 if bad else 0)
          PY

      # Jellyfin reads manifest.json from GitHub main, not from the release
      # asset. Checksums only exist after the zips are built, so this has to
      # land in a follow-up commit rather than on the tag that triggered us.
      - name: Commit catalogue to main
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          cp manifest.json /tmp/catalog-manifest.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B catalog-update origin/main
          cp /tmp/catalog-manifest.json manifest.json

          TAG="$TAG" python3 - <<'PY'
          import json, os
          tag = os.environ["TAG"]
          manifest = json.load(open("manifest.json"))
          history = json.load(open("versions.json"))
          changed = False
          for p in manifest:
              v = p["versions"][0]
              entry = {
                  "version": v["version"],
                  "tag": tag,
                  "asset": v["sourceUrl"].rsplit("/", 1)[-1],
                  "checksum": v["checksum"],
                  "timestamp": v["timestamp"],
                  "changelog": v["changelog"],
              }
              lst = history.setdefault(p["guid"], [])
              if any(e.get("version") == entry["version"] for e in lst):
                  print(f"versions.json already has {p['name']} {entry['version']}")
                  continue
              lst.append(entry)
              changed = True
              print(f"appended {p['name']} {entry['version']}")
          if changed:
              with open("versions.json", "w", encoding="utf-8") as f:
                  json.dump(history, f, indent=2, ensure_ascii=False)
                  f.write("\n")
          PY

          git add manifest.json versions.json
          if git diff --cached --quiet; then
            echo "catalogue on main already matches this release"
            exit 0
          fi
          git commit -m "Update catalogue to ${TAG}"
          git push origin HEAD:main

      # raw.githubusercontent.com caches main for ~5 minutes. Jellyfin re-fetches
      # on Catalog load, so a green run here is the signal that a refresh will
      # see this version — not the zip upload, and not the git push.
      - name: Wait until the catalogue URL serves this release
        env:
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, sys

          repo = os.environ["REPO"]
          expected = {
              p["name"]: p["versions"][0]["version"]
              for p in json.load(open("/tmp/catalog-manifest.json"))
          }
          raw = f"https://raw.githubusercontent.com/{repo}/main/manifest.json"
          try:
              urllib.request.urlopen(
                  f"https://purge.jsdelivr.net/gh/{repo}@main/manifest.json",
                  timeout=30,
              ).read()
              print("purged jsdelivr")
          except Exception as e:
              print(f"jsdelivr purge skipped: {e}")

          def newest(url):
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "catalogue-wait", "Cache-Control": "no-cache"},
              )
              with urllib.request.urlopen(req, timeout=20) as r:
                  body = json.load(r)
              return {p["name"]: p["versions"][0]["version"] for p in body}

          deadline = time.time() + 480
          got = None
          while True:
              try:
                  got = newest(raw)
                  print(f"raw {got}")
                  if got == expected:
                      print("catalogue URL is live")
                      sys.exit(0)
              except Exception as e:
                  print(f"raw fetch failed: {e}")
              if time.time() >= deadline:
                  print(f"FAILED: {raw} still {got}, want {expected}", file=sys.stderr)
                  sys.exit(1)
              time.sleep(10)
          PY
